name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Install Codex CLI for sandbox regression
        run: npm install --global @openai/codex@0.146.0
      - name: Test Codex credential boundary
        env:
          SHUHARI_REQUIRE_CODEX_SANDBOX_TEST: "1"
        run: go test -race -tags=codex_sandbox -run '^TestCodexDefaultSandboxDeniesChildCredentialReads$' -v ./internal/harness
      - name: Prove credential-deny mutation is detected
        env:
          SHUHARI_REQUIRE_CODEX_SANDBOX_TEST: "1"
          SHUHARI_TEST_REMOVE_CREDENTIAL_DENIES: "1"
        run: |
          if go test -race -tags=codex_sandbox -run '^TestCodexDefaultSandboxDeniesChildCredentialReads$' -v ./internal/harness; then
            echo "credential-deny mutation unexpectedly passed"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - name: Build
        run: go build ./cmd/shuhari

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
