name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race -coverprofile=coverage.txt ./...
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Install Codex sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          npm install --global @openai/codex@0.146.0
      - name: Test Codex adapter conformance
        run: |
          sudo env \
            PATH="$PATH" \
            SHUHARI_REQUIRE_CODEX_SANDBOX_TEST=1 \
            "$(command -v go)" test -race -tags=codex_sandbox -run '^TestCodex(ProtectedSandboxConformance|CommandEnvironmentStripsGitHubCredentials)$' -v ./internal/harness
      - name: Prove credential-deny mutation is detected
        run: |
          if sudo env \
            PATH="$PATH" \
            SHUHARI_REQUIRE_CODEX_SANDBOX_TEST=1 \
            SHUHARI_TEST_REMOVE_CREDENTIAL_DENIES=1 \
            "$(command -v go)" test -race -tags=codex_sandbox -run '^TestCodexProtectedSandboxConformance$' -v ./internal/harness; then
            echo "credential-deny mutation unexpectedly passed"
            exit 1
          fi
      - name: Prove filesystem-policy mutation is detected
        run: |
          if sudo env \
            PATH="$PATH" \
            SHUHARI_REQUIRE_CODEX_SANDBOX_TEST=1 \
            SHUHARI_TEST_WEAKEN_FILESYSTEM=1 \
            "$(command -v go)" test -race -tags=codex_sandbox -run '^TestCodexProtectedSandboxConformance$' -v ./internal/harness; then
            echo "filesystem-policy mutation unexpectedly passed"
            exit 1
          fi
      - name: Prove network-policy mutation is detected
        run: |
          if sudo env \
            PATH="$PATH" \
            SHUHARI_REQUIRE_CODEX_SANDBOX_TEST=1 \
            SHUHARI_TEST_FORCE_NETWORK_ENABLED=1 \
            "$(command -v go)" test -race -tags=codex_sandbox -run '^TestCodexProtectedSandboxConformance$' -v ./internal/harness; then
            echo "network-policy mutation unexpectedly passed"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - name: Build
        run: go build ./cmd/shuhari

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
